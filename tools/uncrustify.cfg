# ---------------------------------------------------------------------------
# uncrustify.cfg
# @guterion
# AGPL-3.0-or-later
# Second format pass for C: makes each function signature vertical, also the
# signatures of zero parameters and of one parameter.
# ---------------------------------------------------------------------------
#
# clang-format does the primary work. It sorts the includes, it reflows the
# comments, it adds the missing braces and it makes a signature of two or more
# parameters vertical. One rule stays out of its reach: a signature of zero
# parameters or of one parameter keeps its compact form, because clang-format
# breaks a bracket only when the content does not fit the column limit.
#
# This pass adds those two breaks. It repeats the decisions of .clang-format
# about indent, pointers and braces, because uncrustify indents each file that
# it reads. If the two files disagree, the tools fight and the format
# oscillates between two states.
#
# Run the passes in this order:
#     clang-format -i file.c && uncrustify -c uncrustify.cfg --no-backup file.c
#
# Requires: dev-util/uncrustify

# --- LANGUAGE AND WIDTH ---
# clang-format is the only authority on line width, so uncrustify wraps
# nothing. The value 0 turns its wrapping off.
#
# Giving both tools the same number does not work, because they count
# different things. uncrustify counts bytes and clang-format counts
# columns. A line of localise.c that holds two U+2192 arrows measures 77
# visible columns and 82 bytes, so uncrustify broke a line that
# clang-format considered short, and the next run of clang-format joined
# it again. The pair oscillated on every file that carries non-ASCII
# text, which in this repository is most of them.
code_width                      = 0

# --- INDENTATION ---
# Four columns, spaces only. These values agree with IndentWidth and UseTab.
indent_columns                  = 4
indent_with_tabs                = 0
indent_continue                 = 4
input_tab_size                  = 4
output_tab_size                 = 4
indent_switch_case              = 4
indent_case_brace               = 4
indent_label                    = 0

# The close bracket of a signature returns to the column of the declaration.
# The value 2 aligns it with the start of the statement, which puts it under
# the first character of the return type and above the brace of the body. The
# default value 0 indents it with the parameters, where it reads as a fourth
# parameter instead of as the end of the list.
indent_paren_close              = 2

# --- POINTERS ---
# The asterisk attaches to the type: int* p, not int *p. These three options
# together produce the same result as PointerAlignment: Left.
sp_before_ptr_star              = remove
sp_between_ptr_star             = remove
sp_after_ptr_star               = force
sp_after_ptr_star_func          = force
sp_before_ptr_star_func         = remove

# --- VERTICAL SIGNATURES ---
# This is the section that justifies the second pass.
#
# A definition breaks after the open bracket, after each comma, and before the
# close bracket. The options with the suffix _single apply the same rule to a
# signature of one parameter. In C the form (void) counts as one parameter, so
# the _single options make it vertical too.
nl_func_def_start               = force
nl_func_def_start_single        = force
nl_func_def_args                = force
nl_func_def_end                 = force
nl_func_def_end_single          = force
nl_func_def_empty               = force

# A declaration in a header follows the same rule as a definition. The header
# and the source then present the same shape to the reader.
nl_func_decl_start              = force
nl_func_decl_start_single       = force
nl_func_decl_args               = force
nl_func_decl_end                = force
nl_func_decl_end_single         = force
nl_func_decl_empty              = force

# The parameter starts a new line, and the comma stays at the end of the line
# that it terminates.
nl_func_type_name               = remove
sp_before_comma                 = remove
sp_after_comma                  = force

# --- CALLS ---
# A short call keeps its arguments on one line. A call that already spans
# several lines puts one argument on each line.
#
# The first three options stay at ignore, so uncrustify never breaks a call
# that fits. clang-format alone decides whether a call is too long, and it
# makes that decision against the column limit in the first pass.
#
# The multi_line options then apply only to a call that clang-format already
# broke. They finish the work that clang-format leaves incomplete: its
# BinPackArguments is a boolean with no always-one-per-line value, so once it
# breaks the bracket it packs the arguments onto the middle line whenever they
# fit there. These two options unpack them.
nl_func_call_start              = ignore
nl_func_call_args               = ignore
nl_func_call_end                = ignore
nl_func_call_start_multi_line   = false
nl_func_call_args_multi_line    = true
nl_func_call_end_multi_line     = true

# --- BRACES ---
# The brace of a function opens on a new line. The brace of a control block
# opens on the same line. This is the K&R rule of BreakBeforeBraces: Linux.
nl_fdef_brace                   = force
nl_if_brace                     = remove
nl_for_brace                    = remove
nl_while_brace                  = remove
nl_do_brace                     = remove
nl_switch_brace                 = remove
nl_else_brace                   = remove
nl_elseif_brace                 = remove
nl_brace_else                   = remove
nl_brace_while                  = remove
nl_enum_brace                   = force
nl_struct_brace                 = force
nl_union_brace                  = force

# An initialiser keeps its brace on the line of the '='. Without this
# option uncrustify moves the brace of a constant table to its own line,
# and clang-format pulls it back on the next run, so the two tools
# disagree forever on every table in localise.c and stamps.c.
nl_assign_brace                 = remove

# Each body carries braces, also a body of one statement.
mod_full_brace_if               = add
mod_full_brace_for              = add
mod_full_brace_while            = add
mod_full_brace_do               = add

# --- SPACING ---
# A space divides a keyword from its bracket, and no space divides a function
# name from its bracket. This agrees with SpaceBeforeParens: ControlStatements.
sp_before_sparen                = force
sp_inside_sparen                = remove
sp_func_call_paren              = remove
sp_func_def_paren               = remove
sp_func_proto_paren             = remove
sp_inside_fparen                = remove
sp_inside_paren                 = remove
sp_assign                       = force
sp_arith                        = force
sp_bool                         = force
sp_compare                      = force
sp_after_cast                   = remove

# --- BLANK LINES ---
# One blank line divides two functions. No more than one blank line stays. The
# file finishes with one newline.
nl_max                          = 2
nl_after_func_body              = 2
nl_after_func_proto             = 1
nl_before_block_comment         = 2
eat_blanks_before_close_brace   = true
eat_blanks_after_open_brace     = true
nl_end_of_file                  = force
nl_end_of_file_min              = 1

# --- PROTECTION ---
# Comment reflow stays off, because clang-format already did it in the first
# pass with the correct column limit. Two tools that reflow the same comment
# produce a different result on each run.
cmt_reflow_mode                 = 0
cmt_indent_multi                = false

# --- PROTECTED BLOCKS ---
# A data table whose columns carry meaning keeps its own layout: the
# Terminus glyphs in stamps.c read as bitmaps, one row of twelve bytes
# for each line of the letter. The marker is the one that clang-format
# reads, so one pair of comments holds both passes off the block.
disable_processing_cmt  = " clang-format off"
enable_processing_cmt   = " clang-format on"
